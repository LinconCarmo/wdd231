<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact - Santos FC</title>
  <meta name="description" content="Contact the Santos FC fan site — send feedback, questions, or media. We appreciate your support and will respond when possible.">
  <meta name="author" content="Lincon Carmo">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles/normalize.css">
  <link rel="stylesheet" href="styles/siteplan.css">
  <link rel="icon" href="images/logo.png">
  <meta property="og:title" content="Contact Santos FC Fan Site — Send a Message">
  <meta property="og:description" content="Send a message to the Santos Football Club fan site. Use this form to share feedback, questions, or media related to the club.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://linconcarmo.github.io/wdd231/final/images/logo.png">
  <meta property="og:url" content="https://linconcarmo.github.io/wdd231/final/contact.html">
</head>
<body>
  <header>
    <div class="topbar">
      <img src="images/logo.png" alt="Santos FC logo" style="height:48px;">
      <button class="menu-toggle" aria-controls="main-navigation" aria-expanded="false">Menu</button>
      <nav id="main-navigation">
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="legends.html">Legends</a></li>
          <li><a href="trophies.html">Trophies</a></li>
          <li><a href="contact.html" aria-current="page">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <h1>Contact Santos FC</h1>
    <h2>Contact Us</h2>
    <form action="contact-action.html" method="get" class="contact-form">
      <label for="name">Name</label>
      <input id="name" name="name" required>

      <label for="email">Email</label>
      <input id="email" name="email" type="email" required>

      <label for="message">Message</label>
      <textarea id="message" name="message" required></textarea>

      <button type="submit" class="primary">Send</button>
    </form>
    <script type="module" src="scripts/menu.js"></script>
  </main>

  <footer>
    <p>&copy; 2026 Lincon Carmo | WDD 231</p>
    <p><a href="https://youtu.be/cQyYANBULx0" target="_blank" rel="noopener">Vídeo do Projeto</a></p>
  </footer>
</body>
</html>
